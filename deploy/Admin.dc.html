<!-- ===================== 관리자 로그인 ===================== -->

  <img class="logo" src="./assets/5482377154ed920d0cb96cd0eca71c1a.svg" alt="이루다Bank" style="left:calc(838.6*var(--u));top:calc(675.7*var(--u));width:calc(452.8*var(--u))">
  <label class="sr" for="adid">아이디</label>
  <input id="adid" class="al-in" style="top:calc(848.8*var(--u))" type="text" autocomplete="username" placeholder="아이디를 입력해 주세요" value="{{lgId}}" onChange="{{onLgId}}" onInput="{{onLgId}}">
  <label class="sr" for="adpw">비밀번호</label>
  <input id="adpw" class="al-in" style="top:calc(956.1*var(--u))" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" value="{{lgPw}}" onChange="{{onLgPw}}" onInput="{{onLgPw}}" onKeyDown="{{onLgKey}}">
  <button class="al-btn" onClick="{{doLogin}}">관리자 로그인</button>
  <sc-if value="{{lgErr}}" hint-placeholder-val="{{ false }}"><div class="al-err" role="alert">{{lgErr}}</div></sc-if>
  <a class="al-back" href="Main.dc.html" style="color: #ffffff">직원 앱으로 돌아가기</a>
</div>
</sc-if>

  <sc-if value="{{clean}}" hint-placeholder-val="{{ true }}"></sc-if>
  <button class="savebtn" onClick="{{save}}">저장하기</button>
</div>
<div class="tline"></div>
<button class="tab {{tabCls.staff}}" style="left:calc(432.4*var(--u))" role="tab" aria-selected="{{tabSel.staff}}" onClick="{{goStaff}}">사원 관리</button>

    </div>

<script type="text/x-dc" data-dc-script data-props='{"simulateFail":{"editor":"boolean","default":false,"section":"테스트"},"$preview":{"width":1500,"height":1313}}'>
class Component extends DCLogic {
  state = { store: null, draft: null, savedJson: '', screen: 'login', tab: 'staff', lgId: '', lgPw: '', lgErr: '', pop: null,
    nName: '', nHire: '', nDept: '', nId: '', nPw: '', aId: '', aPw: '',
    upYm: '2026-12', edYm: '2026-11', msgYm: '2026-11', upFileName: '', edFileName: '' };
  upFile = null; edFile = null; popTimer = null;

  /* 관리자 페이지 진입: 로그인 유지 확인 → 서버에서 최신 데이터를 새로 조회 → 화면 그리기 */
  componentDidMount() {
    const I = window.IRUDA;
    I.restore().catch(() => null).then(r => {
      if (!(r && r.role === 'admin')) return;
      return I.refresh().then(store => this.enter(store)).catch(() => this.setState({ lgErr: '서버와 통신이 원활하지 않아요. 잠시 후 다시 시도해 주세요.' }));
    });
  }
  enter(store) {
    const I = window.IRUDA, draft = I.clone(store);
    if (I.mode === 'firebase' && !draft.law.length) draft.law = I.defaultLaw();   // 최초 1회: 기본 법률 카드를 초안으로 채움 (저장하기 시 서버에 기록)
    const ks = Object.keys(store.months).sort(), cur = I.stamp().long.slice(0, 7).replace('.', '-'), latest = ks.length ? ks[ks.length - 1] : cur;
    this.setState({ store, draft, savedJson: JSON.stringify(store), screen: 'main', lgPw: '', lgErr: '', upYm: ks.length ? I.shiftYm(latest, 1) : cur, edYm: latest, msgYm: latest });
  }

  /* ---------- 로그인 ---------- */
  onLgId = (e) => this.setState({ lgId: e.target.value, lgErr: '' });
  onLgPw = (e) => this.setState({ lgPw: e.target.value, lgErr: '' });
  onLgKey = (e) => { if (e.key === 'Enter') this.doLogin(); };
  doLogin = () => {
    const I = window.IRUDA, id = (this.state.lgId || '').trim(), pw = this.state.lgPw || '';
    if (!id || !pw) { this.setState({ lgErr: '관리자 아이디와 비밀번호를 입력해 주세요.' }); return; }
    this.setState({ lgErr: '확인 중이에요…' });
    I.login('admin', id, pw).then(res => {
      if (!res.ok) { this.setState({ lgErr: res.error === 'NETWORK' ? '서버와 통신이 원활하지 않아요. 잠시 후 다시 시도해 주세요.' : res.error === 'TOO_MANY' ? '로그인 시도가 너무 많아요. 잠시 후 다시 시도해 주세요.' : '관리자 아이디 또는 비밀번호를 확인해 주세요.' }); return; }
      return I.refresh().then(store => this.enter(store)).catch(() => this.setState({ lgErr: '서버와 통신이 원활하지 않아요. 잠시 후 다시 시도해 주세요.' }));
    });
  };
  doLogout = () => { window.IRUDA.logout(); this.setState({ screen: 'login', store: null, draft: null, savedJson: '', lgId: '', lgPw: '', lgErr: '' }); };

  goStaff = () => this.setState({ tab: 'staff' });
  goLaw = () => this.setState({ tab: 'law' });
  goUp = () => this.setState({ tab: 'up' });
  goMsg = () => this.setState({ tab: 'msg' });

  /* ---------- 초안(draft) 수정 : 저장하기를 눌러야 서버에 반영 ---------- */
  upd(fn) { const d = JSON.parse(JSON.stringify(this.state.draft)); fn(d); this.setState({ draft: d }); }
  showPop(p) { clearTimeout(this.popTimer); this.setState({ pop: p }); }
  closePop = () => { clearTimeout(this.popTimer); this.setState({ pop: null }); };
  info(title, text) { this.showPop({ kind: 'info', title, text }); }

  setN = (k) => (e) => this.setState({ [k]: e.target.value });
  createAccount = () => {
    const s = this.state, I = window.IRUDA;
    const name = s.nName.trim(), dept = s.nDept.trim(), pw = s.nPw;
    let lid = s.nId.trim();
    let hire = s.nHire.trim();
    if (!name || !hire || !dept || !lid || !pw) { this.info('입력 내용을 확인해 주세요', '이름, 입사일, 부서, 아이디, 비밀번호를 모두 입력해 주세요.'); return; }
    const m = /^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/.exec(hire);
    if (!m) { this.info('입사일 형식을 확인해 주세요', '입사일은 2026.10.10 처럼 입력해 주세요.'); return; }
    if (!/^[A-Za-z0-9._-]{2,40}$/.test(lid)) { this.info('아이디 형식을 확인해 주세요', '아이디는 영문, 숫자, . _ - 만 사용할 수 있어요. (2자 이상)'); return; }
    if (pw.length < 6) { this.info('비밀번호를 확인해 주세요', '비밀번호는 6자 이상이어야 해요.'); return; }
    hire = m[1] + '.' + ('0' + m[2]).slice(-2) + '.' + ('0' + m[3]).slice(-2);
    if (s.draft.accounts.some(a => a.name === name)) { this.info('이미 있는 이름이에요', '엑셀의 이름과 계정 이름이 정확히 일치해야 급여가 연결돼요.\n같은 이름의 계정은 만들 수 없습니다.'); return; }
    lid = lid.toLowerCase();
    if (s.draft.accounts.some(a => a.loginId.toLowerCase() === lid) || lid === String(s.draft.admin.id).toLowerCase()) { this.info('이미 사용 중인 아이디예요', '다른 아이디를 입력해 주세요.'); return; }
    this.upd(d => d.accounts.push({ id: 'a' + Date.now(), name, hire, dept, loginId: lid, pw }));
    this.setState({ nName: '', nHire: '', nDept: '', nId: '', nPw: '' });
  };
  setA = (k) => (e) => this.setState({ [k]: e.target.value });
  changeAdmin = () => {
    const s = this.state, id = s.aId.trim(), pw = s.aPw;
    if (!id || !pw) { this.info('입력 내용을 확인해 주세요', '관리자 아이디와 비밀번호를 모두 입력해 주세요.'); return; }
    if (pw.length < 6) { this.info('비밀번호를 확인해 주세요', '비밀번호는 6자 이상이어야 해요.'); return; }
    if (s.draft.accounts.some(a => a.loginId.toLowerCase() === id.toLowerCase())) { this.info('이미 사용 중인 아이디예요', '직원 계정과 같은 아이디는 사용할 수 없습니다.'); return; }
    this.upd(d => { d.admin = { id, pw }; });
    this.setState({ aId: '', aPw: '' });
    this.info('관리자 계정이 변경 대기 중이에요', '저장하기를 눌러야 새 아이디와 비밀번호가 적용됩니다.');
  };
  /* 사원 계정 엑셀: 업로드(적용) / 다운로드 */
  pickAcct = (e) => {
    const I = window.IRUDA, input = e.target, f = input.files && input.files[0];
    if (!f) return;
    f.arrayBuffer().then(buf => I.parseXlsx(buf)).then(sheets => {
      const d = JSON.parse(JSON.stringify(this.state.draft));
      const res = I.importAccounts(d, sheets);
      if (!res.ok) { this.showPop({ kind: 'noop', title: '반영하지 못했어요', text: res.error + (res.skipped && res.skipped.length ? '\n\n제외된 행: ' + res.skipped.join(', ') : ''), closeText: '확인' }); return; }
      this.setState({ draft: d });
      const sk = res.skipped.length ? '\n\n제외된 행 ' + res.skipped.length + '건: ' + res.skipped.join(', ') : '';
      this.showPop({ kind: 'result', title: '사원 계정을 불러왔어요', text: '새로 추가 ' + res.added + '명 · 정보 수정 ' + res.updated + '명' + sk + '\n\n저장하기를 눌러야 서버에 최종 저장됩니다.', closeText: '확인' });
    }).catch(() => this.showPop({ kind: 'noop', title: '엑셀 파일을 읽을 수 없어요', text: '.xlsx 형식의 파일인지 확인한 뒤 다시 업로드해 주세요.\n기존 데이터는 변경되지 않았습니다.', closeText: '확인' }))
      .then(() => { try { input.value = ''; } catch (x) { } });
  };
  downAcct = () => {
    const I = window.IRUDA, d = this.state.draft, t = I.stamp().long.replace(/\./g, '');
    I.downloadBlob('이루다Bank_사원계정_' + t + '.xlsx', I.buildXlsx(I.accountsToRows(d.accounts), '사원계정')).then(r => { if (r === false) this.info('다운로드할 수 없어요', '이 환경에서는 파일 다운로드가 막혀 있어요.'); });
  };
  addLaw = () => this.upd(d => d.law.push({ id: 'l' + Date.now(), title: '새 카드', body: '' }));

  /* ---------- 월 이동 ---------- */
  upPrev = () => this.setState({ upYm: window.IRUDA.shiftYm(this.state.upYm, -1) });
  upNext = () => this.setState({ upYm: window.IRUDA.shiftYm(this.state.upYm, 1) });
  edPrev = () => this.setState({ edYm: window.IRUDA.shiftYm(this.state.edYm, -1) });
  edNext = () => this.setState({ edYm: window.IRUDA.shiftYm(this.state.edYm, 1) });
  msgPrev = () => this.setState({ msgYm: window.IRUDA.shiftYm(this.state.msgYm, -1) });
  msgNext = () => this.setState({ msgYm: window.IRUDA.shiftYm(this.state.msgYm, 1) });

  /* ---------- 엑셀 업로드 / 수정 업로드 ---------- */
  pickFile(which, e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    f.arrayBuffer().then(buf => {
      if (which === 'up') { this.upFile = { name: f.name, buf }; this.setState({ upFileName: f.name }); }
      else { this.edFile = { name: f.name, buf }; this.setState({ edFileName: f.name }); }
    }).catch(() => this.info('파일을 읽을 수 없어요', '다른 파일로 다시 시도해 주세요.'));
  }
  pickUp = (e) => this.pickFile('up', e);
  pickEd = (e) => this.pickFile('ed', e);
  runUpload(mode) {
    const I = window.IRUDA, s = this.state;
    const file = mode === 'new' ? this.upFile : this.edFile;
    const ym = mode === 'new' ? s.upYm : s.edYm;
    if (!file) { this.info('엑셀 파일을 선택해 주세요', '업로드할 .xlsx 파일을 먼저 선택해 주세요.'); return; }
    this.showPop({ kind: 'saving', title: '엑셀 파일을 읽는 중이에요', text: '잠시만 기다려 주세요.' });
    I.parseXlsx(file.buf).then(sheets => {
      const d = JSON.parse(JSON.stringify(this.state.draft));
      const res = I.applyUpload(d, ym, sheets, { name: file.name, b64: I.bufToB64(file.buf) }, mode);
      if (!res.ok) {
        const extra = res.unmatched && res.unmatched.length ? '\n\n(계정과 일치하지 않은 이름: ' + res.unmatched.join(', ') + ')' : '';
        this.showPop({ kind: 'noop', title: '반영하지 못했어요', text: res.error + extra, closeText: '확인' });
        return;
      }
      if (mode === 'new') { this.upFile = null; this.setState({ draft: d, upFileName: '' }); } else { this.edFile = null; this.setState({ draft: d, edFileName: '' }); }
      const un = res.unmatched.length ? '\n\n계정 이름과 일치하지 않아 제외된 이름 ' + res.unmatched.length + '명: ' + res.unmatched.join(', ') : '';
      this.showPop({ kind: 'result', title: I.ymLabel(ym) + (mode === 'new' ? ' 업로드 완료' : ' 수정 업로드 완료'), text: res.matched.length + '명의 데이터가 반영되었어요 (' + res.matched.join(', ') + ').' + un + '\n\n저장하기를 눌러야 서버에 최종 저장됩니다.', closeText: '확인' });
    }).catch(() => {
      this.showPop({ kind: 'noop', title: '엑셀 파일을 읽을 수 없어요', text: '.xlsx 형식의 파일인지 확인한 뒤 다시 업로드해 주세요.\n기존 데이터는 변경되지 않았습니다.', closeText: '확인' });
    });
  }
  doUpload = () => this.runUpload('new');
  doEdit = () => this.runUpload('edit');

  /* ---------- 저장하기 (서버 저장 중 → 완료 / 실패) ---------- */
  save = () => {
    const I = window.IRUDA, s = this.state;
    if (s.pop && s.pop.kind === 'saving' && s.pop.title.indexOf('저장') === 0) return;
    this.showPop({ kind: 'saving', title: '저장 중이에요', text: '서버에 저장하고 있어요.\n잠시만 기다려 주세요.' });
    const payload = JSON.parse(JSON.stringify(s.draft));
    I.serverSave(payload, { simulateFail: !!this.props.simulateFail }).then((saved) => {
      const st = (saved && saved.accounts) ? saved : payload;   // 서버가 발급한 계정 ID 등을 반영한 최종본
      this.setState({ store: st, draft: I.clone(st), savedJson: JSON.stringify(st) });
      this.showPop({ kind: 'saved', title: '저장 완료', text: '모든 변경 사항이 저장되었어요.' });
      this.popTimer = setTimeout(() => { if (this.state.pop && this.state.pop.kind === 'saved') this.setState({ pop: null }); }, 1500);
    }).catch((err) => {
      const code = err && err.message, keep = '\n기존에 저장된 데이터는 그대로 유지되었습니다.';
      const why = { EMPTY_PAYLOAD: ['저장하지 못했어요', '전송할 데이터가 비어 있어 저장을 중단했어요.'], DUP_LOGIN: ['저장하지 못했어요', '아이디가 겹치는 계정이 있어요. (대소문자 구분 없음)\n사원 관리에서 아이디를 확인해 주세요.'], WEAK_PW: ['저장하지 못했어요', '비밀번호는 6자 이상이어야 해요.'], NO_PW: ['저장하지 못했어요', '새 계정에는 비밀번호가 필요해요.'], NOT_WEBP: ['저장하지 못했어요', '이미지는 WebP 로 변환된 파일만 저장할 수 있어요.'], FORBIDDEN: ['권한이 없어요', '관리자 권한을 확인해 주세요.'], SERVER: ['서버 설정을 확인해 주세요', '계정을 처리하는 서버 함수에서 오류가 났어요.\nVercel 환경변수 FIREBASE_SERVICE_ACCOUNT(서비스 계정 JSON 전체)가 들어 있는지 확인하고, 추가했다면 다시 배포(Redeploy)해 주세요.'], API_404: ['서버 함수를 찾을 수 없어요', 'api/users.js 와 package.json 이 저장소 루트에 올라가 있는지 확인한 뒤 다시 배포해 주세요.'], API_500: ['서버 설정을 확인해 주세요', '서버 함수에서 오류가 났어요. Vercel 환경변수 FIREBASE_SERVICE_ACCOUNT 를 확인해 주세요.'], BAD_TOKEN: ['다시 로그인해 주세요', '로그인 정보가 만료되었어요.'], NOT_SIGNED_IN: ['다시 로그인해 주세요', '로그인 정보가 없어요.'] }[code];
      if (why) this.showPop({ kind: 'fail', title: why[0], text: why[1] + keep + '\n내용을 고친 뒤 다시 저장해 주세요.' });
      else this.showPop({ kind: 'fail', title: '서버와 통신이 원활하지 않아요', text: '네트워크 연결이 불안정해 저장하지 못했어요.' + (err && err.detail ? '\n(상세: ' + err.detail + ')' : '') + keep + '\n연결 상태를 확인한 뒤 다시 저장(재업로드)해 주세요.' });
    });
  };

  renderVals() {
    const I = window.IRUDA, s = this.state;
    const d = s.draft || { admin: { id: '', pw: '' }, accounts: [], months: {}, law: [], messages: {} };
    const U = (n) => n;
    const dirty = s.screen === 'main' && !!s.draft && JSON.stringify(s.draft) !== s.savedJson;

    const staffRows = d.accounts.map((a, i) => {
      const set = (k) => (e) => this.upd(x => { x.accounts[i][k] = e.target.value; });
      return { top: 289.9 + i * 89.2, name: a.name, hire: a.hire, dept: a.dept, loginId: a.loginId, pw: a.pw, pwHint: (I.mode === 'firebase' && a.uid && !a.pw) ? '비밀번호를 입력해 주세요' : '',
        remove: () => this.upd(x => { x.accounts.splice(i, 1); }), setName: set('name'), setHire: set('hire'), setDept: set('dept'), setLoginId: set('loginId'), setPw: set('pw') };
    });
    const staffBottom = 289.9 + d.accounts.length * 89.2;
    const lawRows = d.law.map((c, i) => ({
      left: i % 2 === 0 ? 79 : 1065, top: 375 + Math.floor(i / 2) * 275.2, tid: 'lt' + i, bid: 'lb' + i, title: c.title, body: c.body,
      setTitle: (e) => this.upd(x => { x.law[i].title = e.target.value; }),
      setBody: (e) => this.upd(x => { x.law[i].body = e.target.value; }),
      remove: () => this.upd(x => { x.law.splice(i, 1); })
    }));
    const dnote = d.deductNote || '', setDnote = (e) => this.upd(x => { x.deductNote = e.target.value; });
    const lawBottom = 375 + Math.ceil(d.law.length / 2) * 275.2;

    const months = Object.keys(d.months).sort().reverse();
    const upRows = months.map(k => {
      const m = d.months[k];
      return { ym: I.ymLabel(k), file: (m.file && m.file.name) || '-', up: m.uploadedAt || '-', mod: m.modifiedAt || '-', log: (m.log || []).join(', '),
        dl: () => {
          const fail = () => this.info('다운로드할 수 없어요', '저장된 원본 파일이 없거나 이 환경에서 다운로드가 막혀 있어요.');
          if (!(m.file && m.file.name)) { fail(); return; }
          I.getFile(k, m).then(b64 => (b64 ? I.download(m.file.name, b64) : false)).then(r => { if (r === false) fail(); }).catch(fail);
        } };
    });

    const msgMap = (d.messages || {})[s.msgYm] || {};
    const msgRows = d.accounts.map((a, i) => ({
      top: 98.5 + i * 72, id: 'ms' + i, name: a.name, text: msgMap[a.name] || '', ph: i === 0 ? '개인 전달 메세지가 있다면 입력 해주세요' : '',
      set: (e) => this.upd(x => { x.messages = x.messages || {}; x.messages[s.msgYm] = x.messages[s.msgYm] || {}; x.messages[s.msgYm][a.name] = e.target.value; })
    }));
    const msgH = Math.max(1488, 98.5 + d.accounts.length * 72 + 40);

    let appH = 1856.8;
    if (s.tab === 'staff') appH = Math.max(appH, staffBottom + 120, 1360);
    if (s.tab === 'law') appH = Math.max(appH, lawBottom + 120);
    if (s.tab === 'msg') appH = Math.max(appH, 261.9 + msgH + 100);
    if (s.screen === 'login') appH = 1856.8;

    const p = s.pop;
    const pop = p ? {
      title: p.title, text: p.text || '',
      isSaving: p.kind === 'saving', isOk: p.kind === 'saved', isNo: p.kind === 'fail' || p.kind === 'noop', isInfo: p.kind === 'info' || p.kind === 'result',
      hasBtns: p.kind !== 'saving' && p.kind !== 'saved', retry: p.kind === 'fail', closeText: p.closeText || (p.kind === 'fail' ? '닫기' : '확인'), closeCls: p.kind === 'fail' ? 's' : 'p'
    } : { title: '', text: '' };

    const tabs = ['staff', 'law', 'up', 'msg'];
    const tabCls = {}, tabSel = {};
    tabs.forEach(t => { tabCls[t] = s.tab === t ? 'on' : ''; tabSel[t] = s.tab === t ? 'true' : 'false'; });

    return {
      isLogin: s.screen === 'login', isMain: s.screen === 'main', showAcctXls: s.screen === 'main' && s.tab === 'staff', appH: appH,
      lgId: s.lgId, lgPw: s.lgPw, lgErr: s.lgErr, onLgId: this.onLgId, onLgPw: this.onLgPw, onLgKey: this.onLgKey, doLogin: this.doLogin, doLogout: this.doLogout,
      dirty: dirty, clean: !dirty, save: this.save,
      tabCls, tabSel, goStaff: this.goStaff, goLaw: this.goLaw, goUp: this.goUp, goMsg: this.goMsg,
      tStaff: s.tab === 'staff', tLaw: s.tab === 'law', tUp: s.tab === 'up', tMsg: s.tab === 'msg',
      staffRows, footTop: Math.max(1790.5 - 24.8, staffBottom + 60) - 0,
      nName: s.nName, nHire: s.nHire, nDept: s.nDept, nId: s.nId, nPw: s.nPw,
      setN: { name: this.setN('nName'), hire: this.setN('nHire'), dept: this.setN('nDept'), id: this.setN('nId'), pw: this.setN('nPw') },
      aId: s.aId, aPw: s.aPw, setA: { id: this.setA('aId'), pw: this.setA('aPw') },
      pickAcct: this.pickAcct, downAcct: this.downAcct, createAccount: this.createAccount, changeAdmin: this.changeAdmin,
      lawRows, addLaw: this.addLaw, dnote, setDnote,
      upYmText: I.ymLabel(s.upYm), edYmText: I.ymLabel(s.edYm), upPrev: this.upPrev, upNext: this.upNext, edPrev: this.edPrev, edNext: this.edNext,
      upName: s.upFileName || '엑셀 파일을 업로드 해주세요', upHas: s.upFileName ? 'has' : '', edName: s.edFileName || '엑셀 파일을 업로드 해주세요', edHas: s.edFileName ? 'has' : '',
      pickUp: this.pickUp, pickEd: this.pickEd, doUpload: this.doUpload, doEdit: this.doEdit, upRows,
      msgYmText: I.ymLabel(s.msgYm), msgPrev: this.msgPrev, msgNext: this.msgNext, msgRows, msgH,
      hasPop: !!p, pop, closePop: this.closePop
    };
  }
}
</script>
</body>
</html>
